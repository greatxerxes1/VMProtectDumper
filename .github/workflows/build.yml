name: Build VMProtect Dumper

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    # 1. Download the repository source files
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Add pre-installed MinGW to the environment path
    - name: Add MSYS2 / MinGW to PATH
      run: echo "C:\msys64\mingw64\bin" >> $env:GITHUB_PATH

    # 3. Build using the Makefile
    - name: Compile Project
      run: mingw32-make all

    # 4. Save the compiled tool so you can download it
    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VMProtectDumper-Release
        path: VMProtectDumper.exe
